  <style>
    :root {
      --vz: 1;
    }

    @media (min-width: 1024px) {
      :root {
        --vz: 0.9;
      }

      html {
        zoom: 0.9;
      }
    }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    .boot {
      min-height: calc(100vh / var(--vz));
      min-height: calc(100dvh / var(--vz));
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      background: linear-gradient(to bottom, #fff, #f1f5f9);
      color: #0f172a;
      text-align: center;
    }

    .boot .m {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1d4ed8, #3730a3);
      color: #fff;
      box-shadow: 0 10px 15px -3px rgba(29, 78, 216, 0.3);
      animation: bp 1.6s ease-in-out infinite;
    }

    .boot .l {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
    }

    .boot .l b {
      color: #f59e0b;
    }

    .boot .t {
      width: 180px;
      height: 4px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .boot .t i {
      display: block;
      height: 100%;
      width: 40%;
      background: #1d4ed8;
      border-radius: 99px;
      animation: bi 1.2s ease-in-out infinite;
    }

    .boot small {
      color: #64748b;
      font-size: 13px;
    }

    @keyframes bp {
      50% {
        opacity: 0.6;
        transform: scale(0.97);
      }
    }

    @keyframes bi {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(260%);
      }
    }
  </style>

  <script>

    window.LOCKEXAM_SUPABASE_KEY = ""; // Contoh: "eyJhbGciOi..."

    // Penanganan error global untuk mencegah layar putih bisu (silent white screen)
    window.addEventListener('error', function (e) {
      console.warn('[Exambro Client Notice]', e.message);
    });

    // Mock Cloudflare Turnstile if offline
    window.turnstile = window.turnstile || {
      render: function (el, options) {
        if (options && typeof options.callback === 'function') {
          setTimeout(function () { options.callback('cf-verified'); }, 300);
        }
        return 1;
      },
      reset: function () { },
      remove: function () { }
    };
  </script>
